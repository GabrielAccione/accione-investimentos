name: Weekly dependency review

# Roda toda segunda-feira e também sob demanda (workflow_dispatch).
# Gera `npm audit` + `npm outdated` e mantém uma issue fixa
# ("📦 Revisão semanal de dependências") sempre atualizada com o status —
# não abre uma issue nova a cada execução.

on:
  schedule:
    - cron: "0 9 * * 1" # segundas, 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: npm audit (não falha o job, só coleta)
        run: npm audit --json > audit.json || true

      - name: npm outdated (não falha o job, só coleta)
        run: npm outdated --json > outdated.json || true

      - name: Garante que o label existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "dependencies-report" --color "0E8A16" \
            --description "Relatório semanal automático de dependências" || true

      - name: Atualiza a issue de status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/weekly-dependency-report.js
